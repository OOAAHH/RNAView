name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  gate-b:
    name: "Gate B: legacy-v1 byte-exact (No-C)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Free disk space (runner)"
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          df -h
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
      - run: OUT_DIR=out_phase2_noc bash test_phase2_noc.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-b-report
          path: out_phase2_noc

  gate-c:
    name: "Gate C: science diff + allowlist"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Free disk space (runner)"
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          df -h
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
      - run: bash test_phase3_gate_c.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-report
          path: out_phase3_gate_c

  science:
    name: "science-v1: frozen core regression"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Free disk space (runner)"
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          df -h
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
      - run: OUT_DIR=out_phase3_science bash test_phase3_science.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: science-report
          path: out_phase3_science

  gate-d:
    name: "Gate D: render regression (legacy baseline)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Free disk space (runner)"
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          df -h
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
      - run: EMIT_GOLDEN=on-diff CANDIDATE_BACKEND=pairs-out-noc bash test_phase4_gate_d.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-d-report
          path: out_phase4_gate_d

  pypi-v0:
    name: "PyPI v0: import smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Free disk space (runner)"
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          df -h
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -c "import rnaview; print(rnaview.__version__)"
